[package]
name = "progressus-client"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
bevy = { version = "0.18.1", default-features = false, features = [
    "2d_bevy_render",
    "bevy_winit",
    "default_app",
    "multi_threaded",
    "std",
    "wayland",
    "x11",
] }
progressus-app = { path = "../progressus-app" }

[[bin]]
name = "progressus-client"
path = "src/main.rs"

[lints]
workspace = true
