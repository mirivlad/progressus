[workspace]
members = [
    "crates/progressus-app",
    "crates/progressus-client",
    "crates/progressus-headless",
    "crates/progressus-sim",
    "crates/progressus-worldgen",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.89"

[workspace.lints.rust]
unsafe_code = "forbid"
